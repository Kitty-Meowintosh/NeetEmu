[package]
name = "neetemu"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "An emulator for NEET computers that runs the mod's YSLua interpreter against a reimplemented host API"
license = "MIT"
repository = "https://github.com/Kitty-Meowintosh/NeetEmu"
readme = "README.md"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.9.6"
ureq = "2.12"
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

[build-dependencies]
cc = "1"

[profile.release]
debug = true
